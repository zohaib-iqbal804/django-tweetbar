{% extends 'layout.html' %}
{% block content %}
    <h2>Search results</h2>

    {% for tweet in tweets %}
        <p>{{ tweet.user.username }}: {{ tweet.text }}</p>
        {% if tweet.photo %}
            <img src="{{ tweet.photo.url }}" width="200">
        {% endif %}
    {% empty %}
        <p>No tweets found.</p>
    {% endfor %}
{% endblock %}
